<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prelims PYQ Lab</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2f5d50"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body><script>
(function(){
const APPV="17 Nov 19:19";
const K="pyq_attempts",P="pyq_pending",CQ="pyq_custom",CP="pyq_cpending",KF="pyq_keyfix",KP="pyq_kpending",NT="pyq_notes",NP="pyq_npending",C="pyq_sync";const subs={attempts:[],custom:[],keyfix:[],notes:[]};
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const store={attempts:[K,P],custom:[CQ,CP],keyfix:[KF,KP],notes:[NT,NP]};
function emit(c){const a=get(store[c][0],{});subs[c].forEach(cb=>cb({docs:Object.entries(a).map(([id,v])=>({id,data:()=>v}))}))}
let BANK=null;const bankP=fetch("bank.json").then(r=>r.json()).then(b=>BANK=b);
const db={collection:c=>({onSnapshot:cb=>{if(c=="bank")bankP.then(b=>cb({docs:[{id:"all",data:()=>({items:b})}]}));else if(store[c]){subs[c].push(cb);setTimeout(()=>emit(c),0)}else setTimeout(()=>cb({docs:[]}),0);return()=>{}},
 doc:id=>({set:async v=>{if(!store[c])return;const [k,pk]=store[c];const a=get(k,{});a[id]=v;put(k,a);const p=get(pk,[]);p.push({id,...v});put(pk,p);emit(c);push()},update:async()=>{},delete:async()=>{}})})};
window.__importAttempts=list=>{const a=get(K,{}),p=get(P,[]);list.forEach(v=>{const id=v.ts+"-imp"+(v.qid||"");a[id]=v;p.push({id,...v})});put(K,a);put(P,p);emit("attempts");push()};
window.claude={use:async n=>n=="db"?db:n=="user"?{id:async()=>"me"}:null};
// ---- sync with Google Sheet (Apps Script)
let busy=false;function status(t){const e=document.getElementById("syncst");if(e)e.textContent=t}
async function push(){const cfg=get(C,null);if(!cfg||busy)return;const p=get(P,[]),q=get(CP,[]),f=get(KP,[]),nn=get(NP,[]);if(!p.length&&!q.length&&!f.length&&!nn.length)return pull();busy=true;
 try{const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:cfg.key,attempts:p,questions:q,fixes:f,notes:nn})});const j=await r.json();if(!j.ok)throw j.error;
  put(P,get(P,[]).slice(p.length));put(CP,get(CP,[]).slice(q.length));put(KP,get(KP,[]).slice(f.length));put(NP,get(NP,[]).slice(nn.length));status("Synced "+new Date().toLocaleTimeString())}catch(e){status("Offline — "+(get(P,[]).length+get(CP,[]).length+get(KP,[]).length+get(NP,[]).length)+" waiting to sync")}busy=false;pull()}
function merge(c,list){const k=store[c][0],a=get(k,{});let n=0;(list||[]).forEach(v=>{if(!v||!v.id)return;const {id,...rest}=v;if(!a[id]||((c=="keyfix"||c=="notes")&&(rest.ts||0)>(a[id].ts||0))){a[id]=rest;n++}});if(n){put(k,a);emit(c)}}
async function pull(){const cfg=get(C,null);if(!cfg)return;try{const r=await fetch(cfg.url+"?key="+encodeURIComponent(cfg.key));const j=await r.json();if(!j.ok)throw j.error;
 merge("attempts",j.attempts);merge("custom",j.questions);merge("keyfix",j.fixes);merge("notes",j.notes);status("Synced "+new Date().toLocaleTimeString())}catch(e){status("Can't reach sync — working offline")}}
window.addEventListener("online",push);setInterval(push,60000);
document.addEventListener("DOMContentLoaded",()=>{const bar=document.createElement("div");bar.style.cssText="max-width:760px;margin:0 auto;padding:8px 16px 0;font:13px system-ui;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap";
 bar.innerHTML='<span id="syncst">'+(get(C,null)?"Connecting…":"Sync not set up")+'</span><span style="opacity:.6">· app '+APPV+'</span><button id="syncset" style="font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer">Sync settings</button><span id="syncform" hidden><input id="surl" placeholder="Apps Script web app URL" style="width:260px;font:inherit"> <input id="skey" placeholder="secret key" style="width:120px;font:inherit"> <button id="ssave" style="font:inherit">Save</button></span>';
 document.body.prepend(bar);const cfg=get(C,{});document.getElementById("surl").value=cfg.url||"";document.getElementById("skey").value=cfg.key||"";
 document.getElementById("syncset").onclick=()=>{const f=document.getElementById("syncform");f.hidden=!f.hidden};
 document.getElementById("ssave").onclick=()=>{const url=document.getElementById("surl").value.trim(),key=document.getElementById("skey").value.trim();if(!url||!key)return;put(C,{url,key});document.getElementById("syncform").hidden=true;status("Connecting…");push()};
 push()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script><title>Prelims PYQ Lab</title>
<style>

.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}

.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}

.chip{padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit;font-size:13px}.chip.on{background:var(--acc);color:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.big{font-size:26px;font-weight:600}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}

<main>
<h1>Prelims PYQ Lab</h1>
<div id="status" class="mute">Connecting…</div>
<nav id="nav"></nav>

<script>
const SUBJ={Economy:["Macroeconomy","Budgeting","Taxation","RBI functions","RBI & Banking","Capital/Money Market & FDI","Industries","International Trade","Intl Economic Orgs","Population","Poverty, Health & Education","Employment","Agriculture","Institutions, Laws & Policies","Five-Year Plans"],Environment:["Ecology & Ecosystems","Biodiversity & Protected Areas","Species","Climate Change","Pollution","Conventions & Bodies","Environment Laws"],Polity:["Constitution & Preamble","Fundamental Rights/DPSP/Duties","Parliament","Executive","Judiciary","Federalism & Local Govt","Constitutional Bodies","Statutory Bodies","Elections","Amendments & Schedules"],Geography:["Physical","Climatology","Oceanography","Indian Geography","World Geography","Agriculture & Resources","Maps & Places"],"Science & Tech":["Biology & Health","Space","Defence","IT & Computers","Biotech","Physics/Chemistry basics","Energy"],"Current Affairs":["Schemes","International Relations","Reports & Indices","Misc"],"Modern History":["1757–1857","1857–1905","1905–1920","1920–1947","Reformers & Organisations","Acts & Policies"],"Ancient History":["Prehistoric & IVC","Vedic","Buddhism & Jainism","Mauryas & Post-Maurya","Guptas & Later","South India"],"Art & Culture":["Architecture","Painting","Music & Dance","Literature & Philosophy","Festivals & Misc"],"Medieval History":["Delhi Sultanate","Mughals","Bhakti & Sufi","Vijayanagara & Others"]};
const REASONS=["Didn't know","Concept gap","Elimination error","Misread statement","Silly / rushed","Overthought","Guessed right"];
let FIX={},NOTES={},CORE=[],CUSTOM=[],expl={},db=null,sm=null,uid=null,bank=[],att=[],cur=null,t0=0,dl=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const views=[["practice","Practice"],["log","Log offline"],["review","Review ✗"],["mock","Mock test"],["add","Add questions"],["notes","★ Notes"],["hist","History"],["dash","Dashboard"],["guide","Guideline"]];
$("#nav").innerHTML=views.map(([k,l],i)=>`<button data-v="${k}" class="${i?'':'on'}">${l}</button>`).join("");
$("#nav").onclick=e=>{const v=e.target.dataset.v;if(!v)return;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==v));views.forEach(([k])=>$("#v-"+k).classList.toggle("hid",k!=v));render(v)};
const EX=q=>q.exam||"UPSC Prelims";
function exams(){return [...new Set(["UPSC Prelims",...bank.map(EX)])]}
function subjectsOf(e){const set=new Set(bank.filter(q=>!e||EX(q)==e).map(q=>q.subject));const order=Object.keys(SUBJ).filter(x=>set.has(x));return order.concat([...set].filter(x=>!order.includes(x)).sort())}
function topicsOf(e,s){const set=new Set(bank.filter(q=>(!e||EX(q)==e)&&q.subject==s).map(q=>q.topic));const base=(SUBJ[s]||[]).filter(t=>set.has(t));return base.concat([...set].filter(t=>t&&!base.includes(t)).sort())}
function subjSel(id,all){return `<select id="${id}">${all?'<option value="">All subjects</option>':''}${Object.keys(SUBJ).map(s=>`<option>${s}</option>`).join("")}</select>`}
function topicOpts(s,all){return (all?'<option value="">All topics</option>':'')+(SUBJ[s]||[]).map(t=>`<option>${esc(t)}</option>`).join("")}
function attemptsFor(qid){return att.filter(a=>a.qid==qid)}
// ---------- Practice
function renderPractice(){
 const el=$("#v-practice");
 if(!el.dataset.init){el.dataset.init=1;el.innerHTML=`<div class="card"><div class="row"><select id="pe"></select></div><div class="row" style="margin-top:8px"><select id="ps"></select><select id="pt"><option value="">All topics</option></select><select id="pm"><option value="new">Unattempted first</option><option value="all">Any</option><option value="wrong">Only my ✗</option></select></div><div class="row" style="margin-top:8px"><button class="btn pri" id="pgo">Next question</button></div><div id="pinfo" class="mute" style="margin-top:6px"></div></div><div id="pq"></div>`;
  const fillS=()=>{$("#ps").innerHTML='<option value="">All subjects</option>'+subjectsOf($("#pe").value).map(x=>`<option>${esc(x)}</option>`).join("");$("#pt").innerHTML='<option value="">All topics</option>';info()};
  $("#pe").onchange=fillS;$("#ps").onchange=()=>{$("#pt").innerHTML='<option value="">All topics</option>'+topicsOf($("#pe").value,$("#ps").value).map(t=>`<option>${esc(t)}</option>`).join("");info()};$("#pt").onchange=info;$("#pgo").onclick=nextQ}
 const pe=$("#pe");if(pe){const ex=exams(),v=pe.value;if(pe.options.length!=ex.length||pe.dataset.n!=String(bank.length)){pe.dataset.n=String(bank.length);const sv=$("#ps").value,tv=$("#pt").value;pe.innerHTML=ex.map(x=>`<option>${esc(x)}</option>`).join("");pe.value=ex.includes(v)?v:ex[0];pe.onchange&&pe.onchange();if(sv&&[...$("#ps").options].some(o=>o.value==sv)){$("#ps").value=sv;$("#ps").onchange();if(tv&&[...$("#pt").options].some(o=>o.value==tv))$("#pt").value=tv}info()}}
 info();
}
function pool(){const e=$("#pe").value,s=$("#ps").value,t=$("#pt").value,m=$("#pm").value;let p=bank.filter(q=>EX(q)==e&&(!s||q.subject==s)&&(!t||q.topic==t));
 if(m=="wrong")p=p.filter(q=>{const a=attemptsFor(q.id);return a.length&&a[a.length-1].result!="right"});
 if(m=="new"){const n=p.filter(q=>!attemptsFor(q.id).length);if(n.length)p=n}return p}
function info(){$("#pinfo").textContent=bank.length?`${pool().length} questions in this filter · ${bank.length} in bank`:"Question bank is empty — Claude loads it from your UPSC papers. Use “Log offline” meanwhile."}
const CONF=["Sure","50:50","Guess"];let ELIM=new Set(),CONFV="",CONFAUTO=false;
function nextQ(){const p=pool();if(!p.length){$("#pq").innerHTML='<div class="card mute">Nothing here. Change the filter.</div>';return}
 cur=p[Math.floor(Math.random()*p.length)];t0=Date.now();const L="abcd";
 $("#pq").innerHTML=`<div class="card"><div class="mute">${esc(cur.subject)} › ${esc(cur.topic)} · ${cur.custom?esc((cur.source||EX(cur))+(cur.year&&!String(cur.source||"").includes(cur.year)?" "+cur.year:"")):"UPSC "+esc(cur.year)+" Q"+esc(cur.qno)+' · <span title="Text was OCR\'d from the scanned paper">scan text</span>'}</div>${cur.mode=="image"?`${cur.note?`<div class="mute"><b>${esc(cur.note)}</b></div>`:''}<canvas class="qc" role="img" aria-label="Question ${esc(cur.qno)} from the paper" style="width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;margin:8px 0"></canvas>`:`<pre style="margin:8px 0">${esc(cur.question)}</pre>`}<div class="mute">Strike out what you can eliminate (✕), mark your confidence, then answer.</div>${(cur.options||["","","",""]).map((o,i)=>`<div class="orow"><button class="opt" data-i="${i}">(${L[i]}) ${cur.mode=="image"?"":esc(o)}</button><button class="xb" data-x="${i}" aria-label="Eliminate option ${L[i]}">✕</button></div>`).join("")}<div class="chips" id="conf"><span class="mute" style="align-self:center">Confidence:</span>${CONF.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join("")}</div>${cur.mode!="image"?`<details class="mute"><summary>View original scan</summary><canvas class="qc" style="width:100%;background:#fff;border-radius:8px"></canvas></details>`:""}${cur.unofficial?'<div class="mute">Answer key: unofficial (UPSC key not yet released).</div>':''}<div class="row" style="margin-top:6px"><button class="btn" id="pskip">Skip (would leave blank)</button></div><div id="pres"></div></div>`;
 ELIM=new Set();CONFV="";CONFAUTO=false;drawQ(cur);$("#pq").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 $("#pq").querySelectorAll(".xb").forEach(b=>b.onclick=()=>{const k=+b.dataset.x;ELIM.has(k)?ELIM.delete(k):ELIM.add(k);b.classList.toggle("on",ELIM.has(k));$(`#pq .opt[data-i="${k}"]`).classList.toggle("struck",ELIM.has(k));const auto=ELIM.size==3?"Sure":ELIM.size==2?"50:50":"";if(auto||CONFAUTO){CONFV=auto;CONFAUTO=!!auto;$("#conf").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.c==auto))}});
 $("#conf").onclick=e=>{const c=e.target.dataset.c;if(!c)return;CONFV=c;CONFAUTO=false;$("#conf").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x==e.target))};$("#pskip").onclick=()=>answer(-1)}
const SPR={};function sprite(n){return SPR[n]||(SPR[n]=new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src="s/"+n}))}
async function drawQ(q,sel="#pq"){if(!q.img)return;const [n,y,w,h]=q.img;try{const im=await sprite(n);document.querySelectorAll(sel+" canvas.qc").forEach(c=>{c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,y,w,h,0,0,w,h)})}catch(e){}}
function qBlob(){const c=document.querySelector("#pq canvas.qc");return c?new Promise(r=>c.toBlob(r,"image/jpeg",0.8)):null}
function mergeExpl(){bank.forEach(q=>{if(expl[q.id])Object.assign(q,expl[q.id])})}
function exHtml(q){if(!q.summary&&!q.explanation)return sm?'<button class="btn" id="exbtn">Explain this question</button> <span class="mute">Generates a detailed explanation once and saves it.</span>':'<p class="mute">No explanation saved yet for this question.</p>';
 const ex=q.explanations||[],st=q.statements||[];
 const stale=q.keyFixed&&q.forKey!==q.answer;
 return `${stale?`<p style="color:var(--mid)"><b>Note:</b> this explanation was written for the official key (${q.origAnswer==null?'dropped':'('+"abcd"[q.origAnswer]+')'}), which you've corrected to ${q.answer==null?'dropped':'('+"abcd"[q.answer]+')'}. Read it critically.</p>`:''}${q.dropped?`<p><b>Dropped by UPSC.</b> Most defensible answer: <b>(${esc(q.likely||"?")})</b>. ${esc(q.why_dropped||"")}</p>`:''}<p><b>Summary:</b> ${esc(q.summary||q.explanation)}</p>${q.detail?`<p>${esc(q.detail)}</p>`:''}${q.topic_notes?`<p><b>Topic notes</b></p><p>${esc(q.topic_notes)}</p>`:''}${st.length?'<p><b>Statements</b></p><ul>'+st.map(e=>`<li>${esc(e)}</li>`).join("")+'</ul>':''}${ex.length?'<p><b>Options</b></p><ul>'+ex.map((e,k)=>`<li><b>(${"abcd"[k]})</b> ${esc(e)}</li>`).join("")+'</ul>':''}${(q.option_notes||[]).length?'<p><b>About each option</b> <span class="mute">(often asked in later years)</span></p><ul>'+q.option_notes.map((e,k)=>`<li><b>(${"abcd"[k]})</b> ${esc(e)}</li>`).join("")+'</ul>':''}${(q.related||[]).length?'<p><b>Related facts UPSC could ask next</b></p><ul>'+q.related.map(e=>`<li>${esc(e)}</li>`).join("")+'</ul>':''}${q.keyfact?`<p><b>Remember:</b> ${esc(q.keyfact)} <button class="chip" data-star="${esc(q.keyfact)}" title="Save to ★ Notes">★</button></p>`:''}${q.ev>=2||!sm?'':'<p><button class="btn" id="exup">Make this explanation more detailed</button></p>'}<p class="mute" style="font-size:12px">Tip: select any text above and tap “★ Save” to keep it in ★ Notes.</p>`}
async function qImageBlob(q){if(!q.img)return null;const [n,y,w,h]=q.img;const im=await sprite(n);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,y,w,h,0,0,w,h);return new Promise(r=>c.toBlob(r,"image/jpeg",0.8))}
const GEN={on:false,up:false,async start(up){this.on=true;this.up=!!up;const b=$(up?"#genup":"#genall");if(b)b.textContent="Stop";let wait=0;
 const pri=q=>({"Ancient History":0,"Medieval History":0,"Art & Culture":0,"Science & Tech":1,"Environment":2,"Geography":3}[q.subject]??4);
 while(this.on){const q=this.up?bank.filter(x=>!(x.ev>=2)).sort((a,b)=>pri(a)-pri(b))[0]:bank.find(x=>!(x.summary||x.explanation));if(!q){msg("All done.");break}
  try{msg(`Writing ${q.year} Q${q.qno}…`);await genExpl(q);wait=0;const c=$("#excount");if(c)c.textContent=bank.filter(x=>x.summary||x.explanation).length;const c2=$("#exv2");if(c2)c2.textContent=bank.filter(x=>x.ev>=2).length}
  catch(e){if(e&&e.code=="not_granted"){msg("Claude access not granted.");break}wait=Math.min((wait||30)*2,600);msg(`Claude is busy — retrying in ${Math.round(wait/60)||1} min…`);await new Promise(r=>setTimeout(r,wait*1000))}}
 this.on=false;const b2=$("#genall");if(b2)b2.textContent="Generate all missing";const b3=$("#genup");if(b3)b3.textContent="Upgrade all to detailed"},stop(){this.on=false;msg("Stopping after the current question.")}};
function msg(t){const m=$("#genmsg");if(m)m.textContent=t}

 ${[0,1,2,3].map(k=>`<button class="opt" data-m="${k}" style="${M.ans[M.i]==k?'border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--bg))':''}">(${L[k]}) ${q.mode=="image"?"":esc(q.options[k])}</button>`).join("")}

 $("#msub").onclick=()=>{const un=M.qs.length-Object.keys(M.ans).length;if(un&&!M.confirm){M.confirm=1;$("#msub").textContent=`${un} blank — tap again to submit`;return}submitMock()};
 clearInterval(M.tick);M.tick=setInterval(()=>{const l=M.start+M.dur-Date.now();const c=$("#mclock");if(c)c.textContent=fmt(Math.max(0,l));if(l<=0){clearInterval(M.tick);submitMock()}},1000)}
function fmt(ms){const s=Math.floor(ms/1000);return `${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
async function submitMock(){const M=MOCK;if(M.done)return;M.done=true;clearInterval(M.tick);try{localStorage.removeItem("pyq_mock")}catch(e){}
 const mins=Math.round((Date.now()-M.start)/60000);M.mins=mins;
 for(let k=0;k<M.qs.length;k++){const q=M.qs[k],a=M.ans[k];const res=q.answer==null?"dropped":a==null?"skip":a==q.answer?"right":"wrong";
  await save({qid:q.id,subject:q.subject,topic:q.topic,year:q.year,qno:q.qno,chosen:a==null?-1:a,result:res,reason:res=="wrong"?"":"",note:"",source:"mock",mock:M.start})}
 renderMock()}
function mockResult(){const M=MOCK;let r=0,w=0,b=0;const bys={};M.qs.forEach((q,k)=>{if(q.answer==null)return;const a=M.ans[k];const s=bys[q.subject]||(bys[q.subject]={r:0,w:0,b:0});if(a==null){b++;s.b++}else if(a==q.answer){r++;s.r++}else{w++;s.w++}});
 const sc=(2*r-0.66*w).toFixed(2);
 return `<div class="card"><h2 style="margin-top:0">Mock result: ${sc} / ${2*M.qs.filter(q=>q.answer!=null).length}</h2><p>${r} right · ${w} wrong · ${b} blank · ${M.mins} min. Negative marks cost you ${(0.66*w).toFixed(2)}.</p><p class="mute">Cut-off has been ~75–90 for GS-I. Wrong answers are now in Review ✗ — go there and tag reasons.</p>
 <table><tr><th>Subject</th><th>✓</th><th>✗</th><th>Blank</th><th>Marks</th></tr>${Object.entries(bys).map(([s,x])=>`<tr><td>${esc(s)}</td><td>${x.r}</td><td>${x.w}</td><td>${x.b}</td><td>${(2*x.r-0.66*x.w).toFixed(1)}</td></tr>`).join("")}</table>
 <details><summary>See every question with answers</summary>${M.qs.map((q,k)=>`<p class="mute">Q${k+1} (UPSC ${q.year} Q${q.qno}) — you: ${M.ans[k]==null?'blank':"abcd"[M.ans[k]]}, key: ${q.answer==null?'dropped':"abcd"[q.answer]} ${M.ans[k]!=null&&M.ans[k]==q.answer?'✓':M.ans[k]==null?'':'✗'}${q.summary?' — '+esc(q.summary):''}</p>`).join("")}</details></div>`}
function resumeMock(){try{const m=JSON.parse(localStorage.getItem("pyq_mock")||"null");if(!m||MOCK)return;const qs=m.ids.map(id=>bank.find(q=>q.id==id)).filter(Boolean);if(qs.length!=m.ids.length)return;MOCK={qs,ans:m.ans,flag:m.flag,i:m.i,start:m.start,dur:120*60e3,done:false}}catch(e){}}
function renderAdd(){const el=$("#v-add");if(el.dataset.init){listCustom();return}el.dataset.init=1;
 el.innerHTML=`<datalist id="dlex">${exams().concat(["EPFO APFC","EPFO EO/AO","Coaching mock"]).filter((x,i,a)=>a.indexOf(x)==i).map(x=>`<option value="${esc(x)}">`).join("")}</datalist><datalist id="dlsub">${[...new Set(Object.keys(SUBJ).concat(bank.map(q=>q.subject),["Accounting","Labour Laws","Industrial Relations","Insurance","Social Security","Computer Basics","General Science","Quantitative Aptitude","English","Reasoning"]))].map(x=>`<option value="${esc(x)}">`).join("")}</datalist>

 <div class="row"><input id="ax" list="dlex" placeholder="Exam (e.g. EPFO APFC)"><input id="asr" placeholder="Source (e.g. APFC 2023, Vision mock 4)"></div>

 <div class="card"><h2 style="margin-top:0">Bulk import</h2><p class="mute">Paste rows from a spreadsheet (tab-separated) or CSV, one question per row, in this column order:<br><b>exam, source, subject, topic, year, question, a, b, c, d, answer (a/b/c/d), explanation, remember</b><br>A header row is fine — it's skipped.</p>

 <div class="card" id="clist"></div>`;
 $("#asave").onclick=async()=>{const a=document.querySelector('input[name=aans]:checked');const q={exam:$("#ax").value.trim()||"Custom",source:$("#asr").value.trim(),subject:$("#as").value.trim()||"General",topic:$("#at").value.trim()||"General",year:+$("#ay").value||null,question:$("#aq").value.trim(),options:[0,1,2,3].map(k=>$("#ao"+k).value.trim()),answer:a?+a.value:null,summary:$("#ae").value.trim(),keyfact:$("#ak").value.trim()};
  if(!q.question||q.options.some(o=>!o)||q.answer==null){$("#amsg").textContent="Need the question, all four options and the correct answer.";return}
  await addCustom([q]);$("#amsg").textContent="Saved ✓";["aq","ao0","ao1","ao2","ao3","ae","ak"].forEach(i=>$("#"+i).value="");document.querySelectorAll('input[name=aans]').forEach(r=>r.checked=false)};
 let parsed=[];$("#bprev").onclick=()=>{parsed=parseBulk($("#bulk").value);const bad=parsed.filter(q=>q.err);$("#bmsg").innerHTML=`${parsed.length-bad.length} ready to import${bad.length?`, ${bad.length} with problems:<br>`+bad.slice(0,8).map(q=>`Row ${q.row}: ${esc(q.err)}`).join("<br>"):"."}`;$("#bsave").disabled=!(parsed.length-bad.length)};
 $("#bsave").onclick=async()=>{const ok=parsed.filter(q=>!q.err).map(({row,err,...q})=>q);$("#bsave").disabled=true;await addCustom(ok);$("#bmsg").textContent=`Imported ${ok.length} questions ✓`;$("#bulk").value=""};
 listCustom()}
function parseBulk(t){const lines=t.split(/\r?\n/).filter(l=>l.trim());const out=[];
 lines.forEach((l,i)=>{const c=l.includes("\t")?l.split("\t"):csvRow(l);if(i==0&&/^\s*exam\s*$/i.test(c[0]))return;const [exam,source,subject,topic,year,question,a,b,cc,d,ans,ex,kf]=c.map(x=>(x||"").trim());
  const q={row:i+1,exam:exam||"Custom",source,subject:subject||"General",topic:topic||"General",year:+year||null,question,options:[a,b,cc,d],answer:"abcd".indexOf((ans||"").toLowerCase().replace(/[()]/g,"")),summary:ex||"",keyfact:kf||""};
  if(!question)q.err="no question";else if(q.options.some(o=>!o))q.err="needs four options";else if(q.answer<0)q.err="answer must be a, b, c or d";out.push(q)});return out}
function csvRow(l){const r=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch=='"'&&l[i+1]=='"'){cur+='"';i++}else if(ch=='"')q=false;else cur+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(cur);cur=""}else cur+=ch}r.push(cur);return r}
async function addCustom(list){for(const q of list){const id="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);try{await db.collection("custom").doc(id).set({...q,added:Date.now(),mode:"text"})}catch(e){}}}
function listCustom(){const el=$("#clist");if(!el)return;const by={};CUSTOM.forEach(q=>{const k=EX(q)+" › "+q.subject;by[k]=(by[k]||0)+1});
 el.innerHTML=`<h2 style="margin-top:0">Your added questions (${CUSTOM.length})</h2>${Object.entries(by).map(([k,n])=>`<div>${esc(k)} — <b>${n}</b></div>`).join("")||'<p class="mute">None yet. Practice them from the Practice tab by choosing the exam at the top.</p>'}`}
function applyFix(){bank.forEach(q=>{const f=FIX[q.id];if(q.origAnswer===undefined)q.origAnswer=q.answer;if(f&&!f.undo){q.answer=f.answer;q.keyFixed=true}else{q.answer=q.origAnswer;q.keyFixed=false}})}
function regrade(){applyFix();const by={};bank.forEach(q=>by[q.id]=q);att.forEach(a=>{const q=by[a.qid];if(!q||a.chosen==null||a.chosen<0||a.source=="offline")return;
 const r=q.answer==null?"dropped":a.chosen==q.answer?"right":"wrong";if(r!=a.result){a.result=r;a.regraded=true;if(r=="right"&&a.reason&&a.reason!="Guessed right")a.reason=""}})}
async function addNote(text,q){text=(text||"").replace(/\s+/g," ").trim();if(!text)return false;const id="n"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 const n={qid:q?q.id:"",subject:q?q.subject:"General",topic:q?q.topic:"",exam:q?EX(q):"",src:q?(q.custom?(q.source||EX(q)):"UPSC "+q.year+" Q"+q.qno):"",text:text.slice(0,1500),ts:Date.now()};
 NOTES[id]=n;try{await db.collection("notes").doc(id).set(n)}catch(e){}return true}
let STARQ=null;function starBtn(){let b=$("#starbtn");if(!b){b=document.createElement("button");b.id="starbtn";b.type="button";b.textContent="★ Save";document.body.appendChild(b);
 b.addEventListener("mousedown",e=>e.preventDefault());b.onclick=async()=>{const t=String(window.getSelection()||"");if(await addNote(t,STARQ)){b.textContent="Saved ✓";setTimeout(()=>{b.style.display="none";b.textContent="★ Save";try{window.getSelection().removeAllRanges()}catch(e){}},900)}}}return b}
document.addEventListener("selectionchange",()=>{const sel=window.getSelection();const b=starBtn();if(!sel||sel.isCollapsed||!String(sel).trim()){if(b.textContent=="★ Save")b.style.display="none";return}
 const node=sel.anchorNode&&(sel.anchorNode.nodeType==1?sel.anchorNode:sel.anchorNode.parentElement);const box=node&&node.closest&&node.closest("#exbox,#pres,#v-review .card,#mq");if(!box){b.style.display="none";return}
 STARQ=box.closest("#v-mock")?null:cur;try{const r=sel.getRangeAt(0).getBoundingClientRect();b.style.left=Math.max(8,Math.min(window.innerWidth-110,r.left+r.width/2-45))+"px";b.style.top=Math.max(8,Math.min(window.innerHeight-56,(r.top>60?r.top-48:r.bottom+10)))+"px";b.style.display="block"}catch(e){}});
document.addEventListener("click",async e=>{const t=e.target;if(t.dataset&&t.dataset.star!=null){if(await addNote(t.dataset.star,cur)){t.textContent="✓";t.disabled=true}}
 if(t.id=="exup"&&cur){t.disabled=true;t.textContent="Writing detailed notes… (~30 s)";try{await genExpl(cur);const x=$("#exbox");if(x)x.innerHTML=exHtml(cur)}catch(err){t.disabled=false;t.textContent=err&&err.code=="rate_limited"?"Busy — try again in a minute":"Make this explanation more detailed"}}});
function renderNotes(){const el=$("#v-notes");const byq={};bank.forEach(q=>byq[q.id]=q);
 const fromAtt=att.filter(a=>a.note&&a.note.trim()).map(a=>{const q=byq[a.qid];return ["att:"+a.ts,{qid:a.qid,subject:a.subject||(q&&q.subject)||"General",topic:a.topic||"",src:q?(q.custom?(q.source||EX(q)):"UPSC "+q.year+" Q"+q.qno):(a.year?a.year+" Q"+a.qno:""),text:a.note.trim(),ts:a.ts,fromAtt:true}]});
 const all=Object.entries(NOTES).filter(([id,n])=>!n.deleted).concat(fromAtt).sort((a,b)=>b[1].ts-a[1].ts);
 const subs=[...new Set(all.map(([,n])=>n.subject))].sort();const f=el.dataset.f||"",q=(el.dataset.q||"").toLowerCase();
 const list=all.filter(([,n])=>(!f||n.subject==f)&&(!q||n.text.toLowerCase().includes(q)||String(n.topic).toLowerCase().includes(q)));
 el.innerHTML=`<div class="card"><h2 style="margin-top:0">★ Must-remember notes (${all.length})</h2><p class="mute">Select any text in an explanation and tap “★ Save”, or tap ★ next to “Remember”. Notes you typed in “Key fact to note” after answering appear here too. Synced to all your devices.</p>
 <div class="row"><select id="nf"><option value="">All subjects</option>${subs.map(x=>`<option ${x==f?"selected":""}>${esc(x)}</option>`).join("")}</select><input id="nq" placeholder="Search notes" value="${esc(el.dataset.q||"")}"></div>
 <div class="row" style="margin-top:8px"><button class="btn" id="nexp">Download as text</button></div></div>
 ${list.map(([id,n])=>`<div class="card" style="padding:10px 14px"><div class="mute" style="font-size:12px">${esc(n.subject)}${n.topic?" › "+esc(n.topic):""}${n.src?" · "+esc(n.src):""}</div><div style="margin:4px 0">${esc(n.text)}</div><div class="row">${n.fromAtt?'<span class="mute" style="font-size:12px;align-self:center">from your attempt note</span>':`<button class="btn" data-ndel="${id}" style="flex:0 0 auto">Delete</button>`}${n.qid?`<button class="btn" data-nq="${esc(n.qid)}" style="flex:0 0 auto">Open question</button>`:''}</div></div>`).join("")||'<div class="card mute">No notes yet.</div>'}`;
 $("#nf").onchange=e=>{el.dataset.f=e.target.value;renderNotes()};$("#nq").oninput=e=>{el.dataset.q=e.target.value;clearTimeout(el._t);el._t=setTimeout(()=>{renderNotes();const i=$("#nq");i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)};
 $("#nexp").onclick=async()=>{const txt=list.map(([,n])=>`[${n.subject}${n.topic?" › "+n.topic:""}${n.src?" · "+n.src:""}]\n${n.text}\n`).join("\n");try{if(dl)await dl.save({filename:"pyq_notes.txt",data:txt});else{const u=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));const l=document.createElement("a");l.href=u;l.download="pyq_notes.txt";l.click()}}catch(e){}};

function renderHist(){const el=$("#v-hist");const byq={};bank.forEach(q=>byq[q.id]=q);const f=el.dataset.f||"",r=el.dataset.r||"";

 const list=att.slice().reverse().filter(a=>(!f||a.subject==f)&&(!r||(r=="wrong"?a.result=="wrong":r=="right"?a.result=="right":r=="skip"?a.result=="skip":r=="guess"?(a.conf=="Guess"||a.reason=="Guessed right"):true)));

 el.querySelectorAll("[data-hq]").forEach(b=>b.onclick=()=>{const q=bank.find(x=>x.id==b.dataset.hq);if(!q)return;$("#nav").querySelector('[data-v=practice]').click();const p=pool;pool=()=>[q];nextQ();pool=p})}

async function save(a){a.ts=Date.now();const id=a.ts+"-"+Math.random().toString(36).slice(2,6);if(db&&uid){try{await db.collection("attempts").doc(id).set(a);return}catch(e){$("#status").textContent="Save failed — kept on this device only."}}att.push(a);try{localStorage.setItem("pyq_local",JSON.stringify(att))}catch(e){}render()}
render("practice");
(async()=>{const timer=setTimeout(()=>{$("#status").textContent="Offline mode — data stays on this device."},10000);
 try{dl=await claude.use("downloads")}catch(e){}

 if(!db||!user){clearTimeout(timer);$("#status").textContent="Offline mode — data stays on this device.";try{att=JSON.parse(localStorage.getItem("pyq_local")||"[]")}catch(e){}render();return}
